version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    volumes:
      - ${PWD}/.docker/postgres:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stock_manager
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  minio:
    image: quay.io/minio/minio
    container_name: minio
    command: server /data --console-address ":9090"
    ports:
      - 9000:9000
      - 9090:9090
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ${PWD}/.docker/minio:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3001:3000'
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/stock_manager
