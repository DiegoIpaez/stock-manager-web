name: Build

on:
  pull_request:
    branches: ['dev']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: setupNodeVersion
        uses: actions/setup-node@v4
        with:
          node-version: 18.18.0

      - name: Make .env file
        uses: SpicyPizza/create-envfile@v1.3
        with:
          envkey_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          envkey_NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          envkey_NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          envkey_NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          envkey_S3_REGION: ${{ secrets.S3_REGION }}
          envkey_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          envkey_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          envkey_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          envkey_S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          file_name: .env
          fail_on_empty: false

      - name: Install dependencies
        run: yarn install

      - name: Run build
        run: yarn run build
